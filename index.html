<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='4' fill='%2395523f'/%3E%3Cpath d='M7 10l9-3 9 4 8-3v22l-8 3-9-4-9 3zm9-3v22m9-18v22' fill='none' stroke='%23fff0d0' stroke-width='2'/%3E%3C/svg%3E"
    />
    <meta name="theme-color" content="#22231f" />
    <meta
      name="description"
      content="沿一条素绢长廊，观看五段夜宴，比较屏风两侧的声音。"
    />
    <title>韩熙载夜宴图 · 折屏剧场</title>
  </head>
  <body>
    <div id="app">
      <header id="mast">
        <div class="identity">
          <span class="brandmark" aria-hidden="true">卷</span
          ><strong>手卷研究室</strong>
        </div>
        <nav id="nav" aria-label="主导航"></nav>
        <div id="head-actions"></div>
      </header>
      <section id="trial-bar" aria-label="试听与知觉报告" hidden></section>
      <main id="stage">
        <canvas
          id="world"
          tabindex="0"
          aria-label="五段夜宴立体折屏。方向键沿画卷行走，拖动环视。"
        ></canvas>
        <div class="film" aria-hidden="true"></div>
        <div class="corner corner-tl"></div>
        <div class="corner corner-br"></div>
        <section id="intro">
          <div class="overline"><i></i> 中国叙事手卷 · 空间实验</div>
          <h1>韩熙载夜宴图</h1>
          <p>立体折屏剧场 <span></span> 传顾闳中 · 宋摹本</p>
        </section>
        <div id="annotations"></div>
        <div id="railtools" role="toolbar" aria-label="视图工具"></div>
        <div id="scene-caption">
          <div class="scene-meta"><i></i><span id="scene-number"></span></div>
          <h2 id="scene-title"></h2>
          <p id="scene-desc"></p>
        </div>
        <div id="meter"></div>
        <div id="touch-walk"></div>
        <div id="loading" role="status">
          <strong>正在展开画卷</strong><progress max="1"></progress
          ><span>初始化图形设备</span>
        </div>
        <aside id="drawer" hidden></aside>
        <div id="toast" role="status" hidden></div>
      </main>
      <section id="timeline">
        <div class="timeline-head">
          <div class="timeline-title">
            <span id="timeline-icon"></span>
            <h2>画卷动线</h2>
            <span class="direction">← 自右向左展卷</span>
          </div>
          <button id="tour"></button>
        </div>
        <nav id="chapters" aria-label="五段快速定位"></nav>
      </section>
      <footer id="foot">
        <div class="gestures"></div>
        <span class="study"><i></i> 空间与声场均为研究推定</span>
      </footer>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
